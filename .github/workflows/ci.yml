# The per-push gate, as three independent jobs that run side by side:
#   test          ubuntu + windows (the codex-discovery path handling is
#                 Windows-specific, and the subprocess adapters differ subtly
#                 across OSes) on the supported Python floor and the current
#                 release, in parallel workers.
#   mutations     the regression catalog (tests/mutations.json), once.
#   codex-sandbox hardline's read-only pin under Codex's own sandbox, live.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # A skip must be declared (a skip or skipif mark); one decided at run time,
  # such as a missing extra, fails instead of reading like a pass
  # (tests/conftest.py).
  HARDLINE_STRICT_SKIPS: "1"

# A newer push to the same pull request supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (fresh env)
        run: pip install -e ".[dev,codex-watch]"
      - name: Run tests
        # -rs names every skip: a test that quietly stops running looks
        # identical to one that passes.
        run: python -m pytest -q -rs -n auto
      - name: Import wires the FastMCP server
        # Don't launch the console script here: it's a stdio server that would
        # block on stdin. Importing proves the package + tool registration; the
        # headless test drives the installed console script over MCP.
        run: python -c "import hardline_mcp.server as s; assert s.mcp.name == 'hardline-mcp'; print('OK')"

  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,codex-watch]"
      - name: Check regression mutations
        run: python scripts/mutate.py

  # Live: hardline's read-only pin under Codex's own sandbox - bubblewrap and
  # Seatbelt. `codex sandbox` needs no model and no login, and every secret it
  # is pointed at is a dummy (tests/test_live_sandbox.py). GitHub's Windows
  # runners have no native MXC ("unavailable on this executor"), so the same
  # test is run on a Windows 11 host instead.
  codex-sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Codex
        run: npm install -g @openai/codex@0.162.1
      - name: Let bubblewrap create user namespaces
        # Ubuntu's AppArmor restricts unprivileged user namespaces, which
        # bubblewrap needs; Codex's Linux sandbox does not start without them.
        # Only where the restriction exists, so a runner image without it
        # (ubuntu-latest moves to 26.04 on 2026-10-19) does not fail here.
        if: runner.os == 'Linux'
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run the live sandbox tests
        env:
          HARDLINE_LIVE_SANDBOX: "1"
        run: python -m pytest tests/test_live_sandbox.py -q -rs
