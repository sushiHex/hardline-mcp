# Fresh-environment test matrix — the per-push gate.
# Runs on ubuntu + windows (the codex-discovery path handling is Windows-
# specific, and the subprocess adapters differ subtly across OSes) and on the
# supported Python floor plus a current release.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (fresh env)
        run: pip install -e ".[dev,codex-watch]"
      - name: Run tests
        run: python -m pytest -q -rs
      - name: Check regression mutations
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python scripts/mutate.py
      - name: Import wires the FastMCP server
        # Don't launch the console script here: it's a stdio server that would
        # block on stdin. Importing proves the package + tool registration; the
        # pip install above proves the console-script entry point resolves.
        run: python -c "import hardline_mcp.server as s; assert s.mcp.name == 'hardline-mcp'; print('OK')"

  # Live: hardline's read-only pin under Codex's own sandbox on each platform -
  # bubblewrap, Seatbelt, MXC. `codex sandbox` needs no model and no login, and
  # every secret it is pointed at is a dummy (tests/test_live_sandbox.py).
  codex-sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Codex
        run: npm install -g @openai/codex@0.162.1
      - name: Let bubblewrap create user namespaces
        # Ubuntu's AppArmor restricts unprivileged user namespaces, which
        # bubblewrap needs; Codex's Linux sandbox does not start without them.
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run the live sandbox tests
        env:
          HARDLINE_LIVE_SANDBOX: "1"
        run: python -m pytest tests/test_live_sandbox.py -q -rs
