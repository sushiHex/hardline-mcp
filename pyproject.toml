[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hardline-mcp"
version = "0.6.1"
description = "MCP server for inter-agent messaging between Claude Code, Hermes, and Codex."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "sushiHex" }]
keywords = ["mcp", "agents", "messaging", "claude", "hermes", "codex"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    # mcp 2.0.0 (2026-07) removed mcp.server.fastmcp entirely (confirmed: no
    # FastMCP anywhere under mcp.server's namespace in 2.0.0) - server.py's
    # `from mcp.server.fastmcp import FastMCP` only works on the 1.x line.
    # An unbounded >=1.2.0 constraint let a fresh `pip install` grab 2.0.0 and
    # break at import time (caught via CI failing on a fresh env while local
    # dev passed, pinned to an older resolution by uv.lock). Migrating to
    # whatever replaces FastMCP in 2.x is a separate, larger piece of work;
    # this is the stopgap that keeps installs working today.
    "mcp>=1.2.0,<2.0.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
hardline-mcp = "hardline_mcp.server:main"

[project.urls]
Homepage = "https://github.com/sushiHex/hardline-mcp"
Repository = "https://github.com/sushiHex/hardline-mcp"
Issues = "https://github.com/sushiHex/hardline-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["hardline_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
