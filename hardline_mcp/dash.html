<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hardline</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --card: #f4f3f0; --line: #e1dfda;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #76746f;
  --claude: #2a78d6; --codex: #eb6834; --hermes: #1baf7a; --other: #76746f;
  --bar: #8a8882; --warn: #a15c00; --bad: #c0302f; --good: #1a7f4b; --softpct: 52%;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface: #1a1a19; --card: #232321; --line: #353533;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #98968d;
    --claude: #3987e5; --codex: #d95926; --hermes: #199e70; --other: #98968d;
    --bar: #8a8882; --warn: #e0a030; --bad: #e66767; --good: #4cbf85; --softpct: 80%;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19; --card: #232321; --line: #353533;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #98968d;
  --claude: #3987e5; --codex: #d95926; --hermes: #199e70; --other: #98968d;
  --bar: #8a8882; --warn: #e0a030; --bad: #e66767; --good: #4cbf85; --softpct: 80%;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
/* One screen: a header, then two columns whose panels share the height. A panel that outgrows its
   share scrolls inside itself, never the page. Narrow or short windows fall back to a normal page. */
html, body { height: 100%; }
body { overflow: hidden; }
main { height: 100vh; padding: 14px 22px 16px; display: flex; flex-direction: column; gap: 12px; }
header.top { display: flex; align-items: center; gap: 26px; flex: none; }
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 30px; }
.col { min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.panel { min-height: 0; display: flex; flex-direction: column; }
.panel.grow { flex: 1 1 0; }
.panel.lines { flex: 0 1 auto; max-height: 40%; overflow-y: auto; }
.panel.scrolls { flex: 0 1 auto; max-height: 26%; overflow-y: auto; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.panel.vol { flex: 0 0 auto; }
.panel.quiet { flex: 1 1 0; min-height: 0; overflow-y: auto; }
#traffic { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#traffic svg.chart { flex: none; height: auto; }
#board { flex: 0 1 auto; min-height: 0; }
#board svg.chart { height: auto; }
.fold { margin-top: 8px; }
@media (max-width: 960px), (max-height: 540px) {
  html, body { height: auto; } body { overflow: auto; }
  main { height: auto; } .layout { display: block; } .col { display: block; } .panel { margin-bottom: 22px; }
  .panel.lines, .panel.scrolls { max-height: none; } #board svg.chart { height: auto; }
}
h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: .02em; }
#status { margin-left: auto; color: var(--ink-3); font-size: 12px; display: flex; align-items: center; gap: 6px; }
#status .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: pulse 2s ease-in-out infinite; }
#status.stale { color: var(--bad); } #status.stale .pulse { background: var(--bad); animation: none; }
.ic { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
.ic .solid { fill: currentColor; stroke: none; }
.seg { display: inline-flex; background: var(--card); border-radius: 8px; padding: 2px; gap: 2px; flex: none; }
.seg button { font: inherit; font-size: 12px; border: 0; background: none; color: var(--ink-3); padding: 3px 11px; border-radius: 6px; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.seg button:focus-visible { outline: 2px solid var(--ink-3); outline-offset: 1px; }
#summary { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 0; font-size: 15px; flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-2); cursor: default; }
.chip b { color: var(--ink); font-size: 17px; font-variant-numeric: tabular-nums; }
.chip small { color: var(--ink-3); font-size: 12px; }
.chip.warn, .chip.warn b { color: var(--warn); }
.chip.muted b { color: var(--ink-2); font-weight: 500; }
h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; flex: none; display: flex; align-items: center; gap: 8px; }
h2 .ic { color: var(--ink-3); }
h2 .ttl { white-space: nowrap; }
h2 .meta { flex-wrap: wrap; justify-content: flex-end; row-gap: 4px; margin-left: auto; font-weight: 400; font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 4px 12px; }
.group { margin: 10px 0 2px; color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.list { columns: 2 220px; column-gap: 28px; }
.item { display: flex; align-items: center; gap: 8px; padding: 2px 0; break-inside: avoid; }
.item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .n { color: var(--ink-2); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 4px; }
.item .n.old { color: var(--warn); font-weight: 600; }
.item .n .gap { margin-left: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--other); }
.dot.claude { background: var(--claude); } .dot.codex { background: var(--codex); } .dot.hermes { background: var(--hermes); }
.dot.unknown { background: none; box-shadow: inset 0 0 0 2px var(--ink-3); }
.dot.ring { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 45%, transparent); animation: glow 1.8s ease-in-out infinite; }
.dot.dark { background: none; box-shadow: inset 0 0 0 2px var(--line); }
.dot.dark.ring { box-shadow: inset 0 0 0 2px var(--warn), 0 0 0 3px color-mix(in srgb, var(--warn) 35%, transparent); }
@keyframes glow { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--warn) 10%, transparent); } }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .dot.ring, #status .pulse, .fill.live { animation: none; } }
details summary { cursor: pointer; color: var(--ink-2); display: flex; align-items: center; gap: 8px; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details summary small { color: var(--ink-3); }
details[open] summary { margin-bottom: 8px; }
svg.chart { display: block; width: 100%; height: auto; }
svg.chart text { fill: var(--ink-3); font-size: 11px; }
.board .cable { opacity: var(--o, .6); transition: opacity .15s; }
.board .cable path.line { fill: none; stroke-linecap: round; }
.board .cable.dim { opacity: .08; }
.board .cable:hover { opacity: 1; }
.board .flow { fill: none; stroke: var(--surface); stroke-opacity: .8; stroke-linecap: round; stroke-dasharray: 9 200; stroke-dashoffset: 9; animation: flow 2.6s ease-in-out infinite; }
@keyframes flow { to { stroke-dashoffset: -100; } }
.board text.cnt { fill: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
.board .swatch.hot, .dot.hot { animation: pulse 1.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .board .flow, .board .swatch.hot, .dot.hot { animation: none; } }
.board .plug { fill: var(--ink-3); }
.board text.lbl { fill: var(--ink); font-size: 19px; cursor: default; }
.board text.lbl.temp { font-style: italic; fill: var(--ink-2); }
.board .swatch { stroke: none; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.key .dot { width: 9px; height: 9px; }
.avgkey { display: inline-block; width: 16px; border-top: 2px solid var(--ink-2); opacity: .7; }
.tick { display: inline-block; width: 10px; height: 3px; border-radius: 2px; background: var(--warn); }
.readout { display: flex; align-items: center; gap: 14px; min-height: 22px; font-size: 12.5px; color: var(--ink-2); flex: none; }
.readout .hint { color: var(--ink-3); } .readout .warnnote { color: var(--warn); font-weight: 600; }
.key .dot.other { background: var(--other); }
.key .mini { width: 38px; height: 14px; }
.flowdemo { animation: flow 2.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .flowdemo { animation: none; } }
.row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(50px, 1fr) 84px; gap: 10px; align-items: center; padding: 3px 0; }
.row .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { position: relative; height: 10px; background: var(--card); border-radius: 5px; }
.fill { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: var(--other); min-width: 4px; }
.fill.claude { background: var(--claude); } .fill.codex { background: var(--codex); } .fill.hermes { background: var(--hermes); }
.fill.live { animation: pulse 1.6s ease-in-out infinite; }
.state { color: var(--ink-2); font-size: 12px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.state.failed, .state.lost { color: var(--bad); } .state.completed { color: var(--good); }
.call { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px minmax(0, 1fr) 24px; gap: 8px; align-items: center;
  padding: 5px 0; border-top: 1px solid var(--line); color: var(--ink-2); }
.tag { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-left: 7px; vertical-align: middle; flex: none; }
.who { display: flex; align-items: center; gap: 7px; min-width: 0; }
.who .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .dot { width: 8px; height: 8px; }
.mark { --c: var(--other); width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none;
  border: 2px solid var(--c); background: var(--c); color: var(--surface); }
.mark { border-width: 1.5px; }
.mark .ic { width: 9px; height: 9px; stroke-width: 3; }
.mark.claude { --c: var(--claude); } .mark.codex { --c: var(--codex); } .mark.hermes { --c: var(--hermes); }
.mark.temp { background: var(--surface); color: var(--c); border-style: dashed; }
.mark.unknown { border-color: var(--ink-3); }
.mark.dark { --c: var(--line); color: var(--ink-3); }
.mark.ring { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 45%, transparent); animation: glow 1.8s ease-in-out infinite; }
.mark.hot { animation: pulse 1.4s ease-in-out infinite; }
.mark.ring.hot { animation: glow 1.8s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .mark.ring, .mark.hot { animation: none; } }
.meter { display: inline-flex; height: 6px; border-radius: 3px; overflow: hidden; flex: none; }
.meter .o { background: var(--c); } .meter .i { background: var(--c); opacity: .35; }
.group { display: flex; align-items: center; gap: 8px; }
.play { margin-bottom: 16px; }
.play-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.play-head .ic { color: var(--ink-3); }
.play-head .state { margin-left: auto; }
.pgrid { display: grid; grid-template-columns: 150px repeat(var(--cols), 64px); gap: 6px; align-items: center; justify-content: start; }
.pgrid .rn { color: var(--ink-3); font-size: 12px; text-align: center; }
.pgrid .ln { display: flex; align-items: center; gap: 8px; font-style: italic; color: var(--ink-2); min-width: 0; }
.pgrid .cell { height: 30px; border-radius: 8px; background: var(--card); display: flex; align-items: center; justify-content: center; color: var(--ink-3); }
.pgrid .cell.completed { color: var(--good); } .pgrid .cell.failed, .pgrid .cell.lost { color: var(--bad); }
.pgrid .cell.running { color: var(--ink); animation: pulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .pgrid .cell.running { animation: none; } }
.dot.temp { background: none; box-sizing: border-box; border: 2px dashed var(--other); box-shadow: none; }
.dot.temp.claude { border-color: var(--claude); } .dot.temp.codex { border-color: var(--codex); } .dot.temp.hermes { border-color: var(--hermes); }
.t.temp, .what.temp { font-style: italic; color: var(--ink-2); }
.what { display: flex; align-items: center; gap: 8px; }
.call > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.call .when { color: var(--ink-3); }
.call span.cord { overflow: visible; }
.cord { position: relative; height: 0; border-top: 2px solid var(--ink-3); }
/* A call in the list: a line from who placed it to who took it, with the head at the receiving end,
   as on the board. Amber and dashed while nobody has answered. */
.cord::before { content: ""; position: absolute; top: -5px; left: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.cord::after { content: ""; position: absolute; top: -7px; right: -3px; width: 0; height: 0; border-left: 10px solid var(--ink-3); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.cord.ringing { border-top: 2px dashed var(--warn); }
.cord.ringing::before { background: var(--warn); } .cord.ringing::after { border-left-color: var(--warn); }
.call .status { text-align: right; color: var(--good); }
.call .status.ringing { color: var(--warn); }
.empty { color: var(--ink-3); }
.item, .who, .board text.lbl { cursor: pointer; }
.item:focus-visible, .who:focus-visible { outline: 2px solid var(--ink-3); outline-offset: 2px; border-radius: 6px; }
.item.pinned { background: var(--card); border-radius: 6px; box-shadow: -6px 0 0 var(--card), 6px 0 0 var(--card); }
.who.pinned .t { text-decoration: underline; text-underline-offset: 3px; }
.board text.lbl.pinned { font-weight: 700; }
.pinchip { cursor: pointer; background: var(--card); color: var(--ink); padding: 1px 9px; border-radius: 11px; }
.pinchip .ic { width: .9em; height: .9em; }
body.offline .layout { opacity: .45; filter: grayscale(.6); transition: opacity .3s; }
@media (max-width: 640px) { .row { grid-template-columns: 1fr 90px; } .track { grid-column: 1 / -1; order: 3; }
  .call { grid-template-columns: 44px minmax(0, 1fr) 36px minmax(0, 1fr); } .call .status { display: none; } }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>hardline</h1>
    <div id="summary"></div>
    <div id="span" class="seg" role="group" aria-label="Time span"></div>
    <div id="status"><span class="pulse"></span><span id="statustext">connecting</span></div>
  </header>

  <div class="layout">
    <div class="col">
      <section class="panel"><h2 id="h-board"></h2><div id="board"></div></section>
      <section class="panel vol"><h2 id="h-volume"></h2><div id="traffic"></div></section>
      <section class="panel quiet">
        <div id="idle-section" class="fold" hidden><div id="idle"></div></div>
        <div id="stranded-section" class="fold" hidden><div id="stranded"></div></div>
      </section>
    </div>

    <div class="col">
      <section class="panel lines">
        <h2 id="h-lines"></h2>
        <div id="live"></div>
      </section>
      <section id="play-section" class="panel scrolls" hidden><h2 id="h-play"></h2><div id="play"></div></section>
      <section class="panel scrolls jobs"><h2 id="h-jobs"></h2><div id="jobs"></div></section>
      <section class="panel grow"><h2 id="h-recent"></h2><div id="recent" class="scroll"></div></section>
    </div>
  </div>
</main>
<script>
"use strict";
const SVG = "http://www.w3.org/2000/svg";
// The lists are drawn off-screen first (`stage`) and swapped in only if their markup changed, so a hover
// on a row survives the refresh instead of being torn down every two seconds.
const STAGED = ["live", "idle", "stranded", "play", "jobs", "recent"];
let stage = null;
const $ = (id) => (stage && stage[id]) || document.getElementById(id);
function commit() {
  for (const id of STAGED) {
    const real = document.getElementById(id);
    if (stage[id].innerHTML !== real.innerHTML) real.replaceChildren(...stage[id].childNodes);
  }
}
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

// One small icon set, drawn with the text colour so each one follows its context.
const ICONS = {
  lamp: '<circle cx="12" cy="12" r="3.5" class="solid"/><circle cx="12" cy="12" r="8.5"/>',
  bell: '<path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
  bellOff: '<path d="M6 9a6 6 0 0 1 9-5.2M18 9c0 6 2 7 2 7H8"/><path d="M10 19a2 2 0 0 0 4 0"/><path d="M4 4l16 16"/>',
  moon: '<path d="M20 14a8 8 0 1 1-10-10 6.5 6.5 0 0 0 10 10z"/>',
  hourglass: '<path d="M7 3h10M7 21h10M8 3v3l4 4 4-4V3M8 21v-3l4-4 4 4v3"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  cross: '<path d="M6 6l12 12M18 6L6 18"/>',
  alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
  play: '<path d="M8 5l11 7-11 7z" class="solid"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  bars: '<path d="M5 20V11M12 20V4M19 20v-6"/>',
  cord: '<circle cx="5" cy="12" r="2.2" class="solid"/><circle cx="19" cy="12" r="2.2"/><path d="M7 12h10"/>',
  board: '<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="1.6" class="solid"/><circle cx="16" cy="12" r="1.6" class="solid"/><circle cx="10" cy="17" r="1.6" class="solid"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="1.5" class="solid"/>',
  queue: '<path d="M5 8h14M5 12h14M5 16h9"/>',
  bolt: '<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
  claude: '<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4"/>',
  codex: '<path d="M5 7l5 5-5 5M12.5 18H20"/>',
  hermes: '<path d="M4 14l16-9-5 14-3-6z"/>',
  waves: '<path d="M3 8c3-3 6 3 9 0s6 3 9 0M3 16c3-3 6 3 9 0s6 3 9 0"/>',
  roundtable: '<circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="4.5" r="1.7" class="solid"/><circle cx="19.5" cy="12" r="1.7" class="solid"/><circle cx="12" cy="19.5" r="1.7" class="solid"/><circle cx="4.5" cy="12" r="1.7" class="solid"/>',
  pingpong: '<path d="M4 8h14M14 4l4 4-4 4M20 16H6M10 12l-4 4 4 4"/>',
  search: '<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/>',
};
const icon = (name) => {
  const s = document.createElementNS(SVG, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("class", "ic");
  s.setAttribute("aria-hidden", "true");
  s.innerHTML = ICONS[name]; // fixed strings above, never data
  return s;
};

const agentOf = (s) => String(s).split(":")[0];
const known = (a) => (["claude", "codex", "hermes"].includes(a) ? a : "");
const dur = (s) => (s < 90 ? s + "s" : s < 5400 ? Math.round(s / 60) + "m" : s < 172800 ? Math.round(s / 3600) + "h" : Math.round(s / 86400) + "d");
const plural = (n, one, many) => n + " " + (n === 1 ? one : many || one + "s");
const isLive = (l) => l.liveness === "alive" || l.liveness === "unknown" || l.liveness === "shared";
// Session names carry a random suffix ("construction.f39ce7d2"). It is dropped from view. If two
// sessions then look alike, each gets a small colour tag taken from its own suffix: the same
// session keeps the same tag, and the full name stays in the tooltip.
const HASH = /\.([0-9a-f]{8})$/;
const nameText = (n) => (n.includes(":") ? n.slice(n.indexOf(":") + 1) : n).replace(HASH, "");
// A worker started on demand (a job's CLI, or a bare "codex"/"claude" reporting back) comes and goes.
// It is drawn as a dashed ring, never as a solid dot, so it is not mistaken for a session someone is in.
let twins = new Set(), temps = new Set(), stats = new Map(), maxCalls = 1;
const isTemp = (n) => temps.has(n) || (!n.includes(":") && known(n) !== "");
const isHot = (n) => (stats.get(n)?.last ?? Infinity) <= 300; // a call in the last five minutes
const AGENT_VAR = { claude: "var(--claude)", codex: "var(--codex)", hermes: "var(--hermes)" };

// The agent's own mark: which tool this session is, with the state drawn as a ring around it:
// dashed = started on demand, glowing = calls waiting, pulsing = a call in the last five minutes,
// faint = nobody holds the name.
function mark(name, o = {}) {
  const a = known(agentOf(name));
  const m = el("span", "mark " + a + (o.temp ? " temp" : "") + (o.ring ? " ring" : "") + (o.dark ? " dark" : "") +
    (o.unknown ? " unknown" : "") + (o.hot !== false && isHot(name) ? " hot" : ""));
  m.append(icon(a || "lamp"));
  return m;
}

// A session's name takes a slight tint of its agent's colour, so the name and its mark agree.
const tint = (n) => {
  const c = AGENT_VAR[known(agentOf(n))];
  return c ? `color-mix(in srgb, ${c} 38%, var(--ink))` : "";
};

// How much a session was on the phone this hour: the bar's length is the calls it placed and took,
// solid for placed, faint for taken.
function meter(name) {
  const s = stats.get(name);
  if (!s) return null;
  const total = s.out + s.in;
  const m = el("span", "meter");

const folded = { idle: false, stranded: false }; // which lists the viewer has opened, kept across refreshes

function idle(d) {

function layout(links) {
  const names = [...new Set(links.flatMap((l) => [l.from, l.to]))];
  const isLeft = (n) => agentOf(n) === "claude" && n.includes(":");
  const sess = (n) => n.includes(":") && (agentOf(n) === "claude" || agentOf(n) === "codex");
  const lefts = names.filter(isLeft).sort(), rights = names.filter((n) => !isLeft(n)).sort();
  const companion = (a, b) => { const x = nameText(a), y = nameText(b); return x === y || x.startsWith(y + "-") || y.startsWith(x + "-"); };
  const weight = (a, b) => links.filter((l) => (l.from === a && l.to === b) || (l.from === b && l.to === a)).reduce((s, l) => s + l.n, 0);
  const rows = [], usedL = new Set(), usedR = new Set();

    if (!sess(r)) continue;
    const m = lefts.find((l) => !usedL.has(l) && companion(l, r));
    if (m) { rows.push([m, r]); usedL.add(m); usedR.add(r); }

    rows.push([best, r]);

// with its own arrowhead, so a two-way conversation reads as two-way and a one-way call as one-way.
function board(d) {

  const box = $("board");
  // Redraw only when something drawn changes. A pair's age ticks every second, but only its tier is drawn.
  const tier = (l) => ((l.last_s ?? 3600) <= 300 ? 0 : (l.last_s ?? 3600) <= 1800 ? 1 : 2);
  const col = box.closest(".col"); // the board hugs its rows; the column's height is what it may use
  // Sorted: pairs with equal counts come back from the store in no fixed order.
  const key = JSON.stringify(links.map((l) => [l.from, l.to, l.n, l.unread, tier(l)]).sort()) + box.clientWidth + "x" + col.clientHeight + pinned;
  if (key === boardKey) return; // unchanged: leave it, so a hover is not wiped every 2s
  boardKey = key;
  box.replaceChildren();
  if (!links.length) return box.append(el("div", "empty", `No calls in ${last()}.`));

  svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  });

    const w = bar(p + t), wp = w * p / (p + t), wt = w - wp, wu = t ? wt * Math.min(waiting.get(n) || 0, t) / t : 0;
    const colour = AGENT_VAR[agentOf(n)] || "var(--other)", x0 = right ? W - 8 : 8;

  //  - thickness is the total number of calls;
  //  - colour runs from one agent's to the other's and turns where the balance of who placed them lies,
  //    so a line that is mostly one colour is mostly that agent talking;
  //  - an amber head means calls to that end are still unanswered;

    const route = (x1, y1, x2, y2) => {
      if (across) { const s = x2 > x1 ? 1 : -1; return `M${x1} ${y1} C ${x1 + s * 130} ${y1}, ${x2 - s * 130} ${y2}, ${x2} ${y2}`; }
      return `M${x1} ${y1} C ${x1 + into * 70} ${y1}, ${x2 + into * 70} ${y2}, ${x2} ${y2}`; // an arc through the middle
    };

    g.append(mk("title", {}, group.map((l) => `${l.from} to ${l.to}: ${plural(l.n, "call")}` + (l.unread ? `, ${l.unread} not answered` : "")).join("\n") + `\nlast ${dur(age)} ago`));
    // A head at the end that received the calls: sized by its own volume, never smaller than the line,
    // and the line stops inside it, so the head covers the line's end.
    const size = (l) => {
      const own = thick(l.n);
      return { half: Math.max(6 * k, own * 0.9 + 3, w / 2 + 4), len: Math.max(11 * k, own * 1.5 + 6, w * 1.3 + 5) };
    };
    const stub = 6 * k + w * 0.3; // the bit of line left on the arrow's side of a break
    const toB = across ? (xb > xa ? 1 : -1) : -into; // which way a call from a is heading as it arrives at b
    const toA = across ? -toB : -into; // and one from b, arriving at a
    // Where the line stops: inside the head normally, or short of it, leaving a break, while calls that
    // way are still unanswered.
    // An end with no head stops where a head would sit, so its dot lines up with the arrows on other rows.
    const inset = (l, x, heading) => x - heading * (2 + (!l ? 6 * k : l.unread ? size(l).len + stub + 8 * k + w * 0.4 : size(l).len * 0.6));
    const ea = inset(back, xa, toA), eb = inset(fwd, xb, toB);
    const d = route(ea, ya, eb, yb);
    g.append(mk("path", { d, class: "line", stroke, "stroke-width": w.toFixed(1), "stroke-dasharray": group.some((l) => isTemp(l.from)) ? "8 5" : "none" }));
    if (age <= 300) g.append(mk("path", { d: latest.from === a ? d : route(eb, yb, ea, ya), class: "flow", pathLength: 100, "stroke-width": Math.max(2, w * 0.5).toFixed(1) }));
    // The head takes the colour the line actually has where it arrives (a lopsided conversation can
    // turn the line before it reaches the end).
    const head = (l, x, y, heading, colour) => {
      const { half, len } = size(l), tip = x - heading * 2, base = tip - heading * len;
      if (l.unread) { // the stub: line, break, a little line, then the head
        const from = tip - heading * len * 0.6, to = base - heading * stub;
        g.append(mk("path", { d: `M${to} ${y} L${from} ${y}`, class: "line", stroke: colour, "stroke-width": w.toFixed(1) }));
      }
      g.append(mk("polygon", { points: `${tip},${y} ${base},${y - half} ${base},${y + half}`, fill: colour }));
    };
    if (fwd) head(fwd, xb, yb, toB, colourAt(eb));
    if (back) head(back, xa, ya, toA, colourAt(ea));
    // An end that only placed calls has no head: it ends in a dot of its own colour instead.
    const tail = (x, y, colour) => g.append(mk("circle", { cx: x, cy: y, r: Math.max(3.5 * k, w / 2 + 1.5), fill: colour }));
    if (!back) tail(ea, ya, colA);
    if (!fwd) tail(eb, yb, colB);
    g.addEventListener("mouseenter", () => focus((x) => group.includes(x)));
    g.addEventListener("mouseleave", refocus);
    svg.append(g);
    cables.push({ el: g, links: group });
  }
  // The sessions themselves: a plug, the agent's badge, and the name.
  for (const name of rowOf.keys()) {
    const y = yOf(name), x = xOf(name), right = sideOf.get(name) === 1;
    const colour = AGENT_VAR[agentOf(name)] || "var(--other)", temp = isTemp(name);
    const off = 21 * k, br = 8.5 * k, cx = right ? x + off : x - off;
    // A solid badge in the agent's colour with its glyph in white; an on-demand reviewer is the same
    // glyph in a dashed outline instead, so the two are never confused.
    const badge = mk("g", { class: "swatch" + (isHot(name) ? " hot" : "") });
    badge.append(mk("circle", temp
      ? { cx, cy: y, r: br, fill: "var(--surface)", stroke: colour, "stroke-width": 1.6, "stroke-dasharray": "3 2.2" }
      : { cx, cy: y, r: br, fill: colour }));
    const glyph = mk("g", {
      transform: `translate(${cx - 5.5 * k} ${y - 5.5 * k}) scale(${0.4583 * k})`, stroke: temp ? colour : "var(--surface)", fill: "none",
      "stroke-width": 3.4, "stroke-linecap": "round", "stroke-linejoin": "round",
    });
    glyph.innerHTML = ICONS[known(agentOf(name)) || "lamp"]; // fixed strings, never data
    badge.append(glyph);
    svg.append(badge);
    const tag = tagOf(name), lab = off + br + 8.5; // where the name starts, past the badge
    if (tag) svg.append(mk("rect", { x: right ? x + lab - 5 : x - lab - 4, y: y - 4.5, width: 9, height: 9, rx: 2.5, fill: tag, class: "swatch" }));
    const label = mk("text", {
      x: right ? x + lab + (tag ? 15 : 0) : x - lab - (tag ? 15 : 0), y: y + 6 * k, "text-anchor": right ? "start" : "end",
      class: "lbl" + (temp ? " temp" : "") + (pinned === name ? " pinned" : ""),
    }, short(nameText(name)));
    label.style.fontSize = 19 * kf + "px";
    label.style.fill = tint(name);
    label.append(mk("title", {}, name));
    label.addEventListener("mouseenter", () => focus(focusFor(name)));
    label.addEventListener("mouseleave", refocus);
    label.addEventListener("click", () => pin(name));
    svg.append(label);
  }
  box.append(svg);
  refocus(); // a pinned name stays lit across a redraw
}

// Calls per minute for the last hour, stacked by the agent that placed them, in muted tints so it sits
// quietly beside the board. Hover a minute for its readout; the line is a five-minute average; an amber
// tick under a minute means some of its calls were never answered.
const STACK = ["claude", "codex", "hermes", "other"];
const soft = (c) => `color-mix(in srgb, ${c} var(--softpct, 52%), var(--surface))`; // lighter mix on a light page, stronger on a dark one
let trafficKey = "";
function traffic(d) {
  // The chart takes the height its panel has (within reason), so the left column has no blank gap.
  const box = $("traffic");
  const n = d.traffic.length, W = 1000, pad = 26, gutter = 30, bw = (W - gutter) / n;
  const col = box.closest(".col"); // a share of the column, not of its own height, so it cannot feed back on itself
  const H = Math.max(90, Math.min(190, Math.floor((col.clientHeight || 700) * 0.26 / ((box.clientWidth || W) / W) - pad)));
  const max = Math.max(1, ...d.traffic), total = d.traffic.reduce((a, b) => a + b, 0);
  const by = d.traffic_by || {}, pend = d.traffic_unanswered || [];
  const lost = pend.reduce((a, b) => a + b, 0);
  const legend = STACK.filter((a) => by[a]).map((a) => {
    const s = el("span", "key"), sw = el("span", "dot");
    sw.style.background = soft(AGENT_VAR[a] || "var(--other)");
    s.append(sw, a);
    return s;
  });
  const avg = el("span", "key"); avg.append(el("span", "avgkey"), "5-min average");
  const miss = el("span", "key"); miss.append(el("span", "tick"), "unanswered");
  const slot = d.bucket_s === 60 ? "minute" : spanText(d.bucket_s);
  heading("h-volume", "bars", "Call volume", el("span", "", total ? `${total} in ${last()}, busiest ${slot} ${max}` : `none in ${last()}`),
    ...legend, ...(total ? [avg] : []), ...(lost ? [miss] : []));
  const key = JSON.stringify([d.traffic, by, pend]) + H;
  if (key === trafficKey && box.firstChild) return; // unchanged: keep the chart, and a hover on it
  trafficKey = key;
  box.replaceChildren();
  if (!total) return;
  const readout = el("div", "readout");
  const idle = () => readout.replaceChildren(el("span", "hint", "hover a bar for detail"));
  idle();
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("class", "chart");
  svg.setAttribute("viewBox", `0 0 ${W} ${H + pad}`);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `Calls per ${slot} over ${last()}, busiest ${slot} ${max}`);
  const mk = (tag, attrs, text) => {
    const e = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const yv = (v) => H - (v / max) * (H - 6);
  const xo = (i) => gutter + i * bw;
  const bands = d.traffic.map((_, i) => {
    const b = mk("rect", { x: xo(i), y: 0, width: bw, height: H, rx: 3, fill: "var(--card)", opacity: 0 });
    svg.append(b);
    return b;
  });
  for (const v of [...new Set([max, Math.round(max / 2)])].filter((x) => x > 0)) {
    svg.append(mk("line", { x1: gutter, x2: W, y1: yv(v), y2: yv(v), stroke: "var(--line)", "stroke-dasharray": "2 5" }));
    svg.append(mk("text", { x: 0, y: yv(v) + 4 }, String(v)));
  }
  svg.append(mk("line", { x1: gutter, x2: W, y1: H, y2: H, stroke: "var(--line)" }));
  d.traffic.forEach((v, i) => {
    const x = xo(i) + 1.5, w = Math.max(bw - 3, 3);
    if (!v) { svg.append(mk("rect", { x, y: H - 2, width: w, height: 2, rx: 1, fill: "var(--line)" })); return; } // a quiet minute
    let top = H;
    for (const a of STACK.filter((s) => by[s] && by[s][i])) {
      const h = (by[a][i] / max) * (H - 6);
      top -= h;
      svg.append(mk("rect", { x, y: top, width: w, height: Math.max(h - 1.5, 2), rx: 2.5, fill: soft(AGENT_VAR[a] || "var(--other)") }));
    }
  });
  pend.forEach((p, i) => { if (p) svg.append(mk("rect", { x: xo(i) + 1.5, y: H + 4, width: Math.max(bw - 3, 3), height: 3, rx: 1.5, fill: "var(--warn)" })); });
  const pts = d.traffic.map((_, i) => {
    const win = d.traffic.slice(Math.max(0, i - 4), i + 1);
    return `${(xo(i) + bw / 2).toFixed(1)},${yv(win.reduce((a, b) => a + b, 0) / win.length).toFixed(1)}`;
  });
  svg.append(mk("polyline", { points: pts.join(" "), fill: "none", stroke: "var(--ink-2)", "stroke-width": 1.6, "stroke-linejoin": "round", "stroke-linecap": "round", opacity: 0.7 }));
  d.traffic.forEach((v, i) => {
    const hit = mk("rect", { x: xo(i), y: 0, width: bw, height: H + pad, fill: "transparent" });
    hit.addEventListener("mouseenter", () => {
      bands[i].setAttribute("opacity", 0.8);
      const ago = (n - 1 - i) * d.bucket_s, when = ago === 0 ? "just now" : `${spanText(ago)} ago`;
      readout.replaceChildren(el("b", "", when), ` · ${plural(v, "call")}`);
      for (const a of STACK.filter((s) => by[s] && by[s][i])) {
        const s = el("span", "key"), sw = el("span", "dot");
        sw.style.background = soft(AGENT_VAR[a] || "var(--other)");
        s.append(sw, `${a} ${by[a][i]}`);
        readout.append(s);
      }
      if (pend[i]) readout.append(el("span", "warnnote", `${pend[i]} unanswered`));
    });
    hit.addEventListener("mouseleave", () => { bands[i].setAttribute("opacity", 0); idle(); });
    svg.append(hit);
  });
  for (const [x, anchor, text] of [[gutter, "start", spanText(d.window_s) + " ago"], [gutter + (W - gutter) / 2, "middle", spanText(d.window_s / 2) + " ago"], [W, "end", "now"]]) {
    svg.append(mk("text", { x, y: H + pad - 4, "text-anchor": anchor }, text));
  }
  box.append(readout, svg);
}

// A playbook play: reviewers labelled <play>-<round>-<lane>, drawn as lanes (rows) by rounds (columns).
const PLAY_ICON = { "swim-lanes": "waves", roundtable: "roundtable", "ping-pong": "pingpong" };
function playbook(d) {
  const plays = new Map();
  for (const j of d.jobs) {
    if (!j.play) continue;
    const key = j.play.name + "|" + j.requester;
    if (!plays.has(key)) plays.set(key, { name: j.play.name, requester: j.requester, jobs: [] });
    plays.get(key).jobs.push(j);
  }
  $("play-section").hidden = !plays.size;
  const box = $("play");
  box.replaceChildren();
  if (!plays.size) return;
  heading("h-play", "roundtable", "Playbook");
  for (const p of plays.values()) {
    const rounds = [...new Set(p.jobs.map((j) => j.play.round))].sort((a, b) => a - b);
    const lanes = [];
    for (const j of [...p.jobs].reverse()) if (!lanes.includes(j.play.lane)) lanes.push(j.play.lane);
    const cells = new Map();
    for (const j of p.jobs) { const k = j.play.lane + "|" + j.play.round; if (!cells.has(k)) cells.set(k, j); } // newest first
    const active = p.jobs.some((j) => j.state === "running" || j.state === "queued");
    const bad = p.jobs.some((j) => j.state === "failed" || j.state === "lost");
    const [sIcon, sWord] = active ? ["play", "in progress"] : bad ? ["cross", "a lane failed"] : ["check", "every lane finished"];
    const wrap = el("div", "play");
    const head = el("div", "play-head");
    const status = el("span", "state " + (active ? "running" : bad ? "failed" : "completed"));
    status.title = sWord;
    status.append(icon(sIcon));
    head.append(icon(PLAY_ICON[p.name] || "roundtable"), el("b", "", p.name), who(p.requester), status);
    const grid = el("div", "pgrid");
    grid.style.setProperty("--cols", rounds.length);
    grid.append(el("span"));
    for (const r of rounds) grid.append(el("span", "rn", String(r)));
    for (const lane of lanes) {
      const first = p.jobs.find((j) => j.play.lane === lane);
      const ln = el("div", "ln");
      ln.append(mark(first.agent, { temp: true, hot: false }), lane);
      grid.append(ln);
      for (const r of rounds) {
        const j = cells.get(lane + "|" + r);
        const cell = el("div", "cell " + (j ? j.state : "none"));
        if (j) {
          const [ic, word] = STATE[j.state] || ["clock", j.state];
          cell.title = `${lane}, round ${r}: ${word}, ${dur((j.start_s ?? 0) - (j.end_s ?? 0))}`;
          cell.append(icon(ic));
        }
        grid.append(cell);
      }
    }
    wrap.append(head, grid);
    box.append(wrap);
  }
}

function jobs(d) {
  heading("h-jobs", "search", "Reviews");
  const box = $("jobs");
  box.replaceChildren();
  const single = d.jobs.filter((j) => !j.play);
  if (!single.length) return box.append(el("div", "empty", "none"));
  for (const j of single) {
    const row = el("div", "row");
    const what = el("div", "what temp");
    what.append(mark(j.agent, { temp: true }), el("span", "", j.label || j.id));
    what.title = `${j.agent} reviewer started by ${j.requester} (${j.id})`;
    const track = el("div", "track");
    const active = j.end_s === null && j.state !== "lost";
    const from = Math.min(j.start_s ?? 0, d.window_s), to = active ? 0 : Math.min(j.end_s ?? j.start_s ?? 0, d.window_s);
    const fill = el("div", "fill " + known(agentOf(j.agent)) + (active && j.state === "running" ? " live" : ""));
    fill.style.left = (100 * (1 - from / d.window_s)) + "%";
    fill.style.width = (100 * Math.max(from - to, 0) / d.window_s) + "%";
    track.append(fill);
    const [ic, word] = STATE[j.state] || ["clock", j.state];
    const state = el("div", "state " + j.state);
    state.title = word;
    state.append(icon(ic), dur((j.start_s ?? 0) - (j.end_s ?? 0)));
    row.append(what, track, state);
    box.append(row);
  }
}

function recent(d) {
  heading("h-recent", "cord", "Latest calls");
  const box = $("recent");
  box.replaceChildren();
  if (!d.recent.length) return box.append(el("div", "empty", "none yet"));
  for (const m of d.recent) {
    const row = el("div", "call");
    const ring = m.read ? "" : " ringing";
    const status = el("span", "status" + ring);
    status.title = m.read ? "answered" : "still ringing";
    status.append(icon(m.read ? "check" : "bell"));
    row.append(el("span", "when", dur(m.age_s ?? 0)), who(m.from), el("span", "cord" + ring), who(m.to), status);
    box.append(row);
  }
}

// The span everything time-bound covers: chosen in the header, remembered by this browser only.
const SPANS = ["15m", "1h", "6h"], SPAN_TEXT = { "15m": "15 minutes", "1h": "hour", "6h": "6 hours" };
let span = "1h";
try { const saved = localStorage.getItem("hardline.span"); if (SPANS.includes(saved)) span = saved; } catch (e) { /* private window: the default will do */ }
const last = () => "the last " + SPAN_TEXT[span];
const spanText = (s) => (s >= 3600 ? +(s / 3600).toFixed(1) + "h" : Math.round(s / 60) + "m");
function spanControl() {
  const box = document.getElementById("span");
  box.replaceChildren();
  for (const s of SPANS) {
    const b = el("button", s === span ? "on" : "", s);
    b.type = "button";
    b.setAttribute("aria-pressed", String(s === span));
    b.addEventListener("click", () => {
      if (s === span) return;
      span = s;
      try { localStorage.setItem("hardline.span", s); } catch (e) { /* not remembered, still applied */ }
      boardKey = ""; trafficKey = "";
      spanControl();
      tick();
    });
    box.append(b);
  }
}
spanControl();

async function tick() {
  const st = $("status"), text = $("statustext");
  try {
    const asked = span;
    const r = await fetch("/api/state?window=" + asked, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (asked !== span) return; // the span changed while this was in flight; a fresher answer is coming
    lastData = d;
    stage = Object.fromEntries(STAGED.map((id) => [id, document.createElement("div")]));
    indexNames(d);
    summary(d); live(d); board(d); playbook(d); traffic(d); jobs(d); recent(d); idle(d); stranded(d);
    commit();
    stage = null;
    lastOk = Date.now();
    document.body.classList.remove("offline");
    st.className = "";
    text.textContent = d.unavailable.length ? "no data: " + d.unavailable.join(", ") : "live";
  } catch (e) {
    stage = null;
    document.body.classList.add("offline"); // what is shown may be old: say so by dimming it
    st.className = "stale";
    text.textContent = lastOk ? "offline " + dur(Math.round((Date.now() - lastOk) / 1000)) : "cannot reach";
  }
}
tick();
setInterval(tick, 2000);
window.addEventListener("resize", () => { if (lastData) { board(lastData); traffic(lastData); } }); // the drawings fit their panels
</script>
</body>
